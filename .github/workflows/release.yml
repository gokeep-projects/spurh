name: Build & Release

# 每次推送 master 自动打包并发布 nightly；推送 v* 标签时发布正式 Release。
# 发布说明自动读取 changelog/<版本号>.md 的最新内容。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spurh-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows 打包 (x64 安装包 + 便携版)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用 (NSIS + MSI)
        run: npm run tauri build

      - name: 归集产物并按规范命名
        shell: pwsh
        run: |
          $stamp = "${{ github.sha }}".Substring(0, 8)
          if ('${{ github.ref_type }}' -eq 'tag') { $stamp = '${{ github.ref_name }}'.TrimStart('v') }
          New-Item -ItemType Directory -Force -Path release-artifacts, portable-tmp | Out-Null
          Copy-Item src-tauri/target/release/spurh.exe portable-tmp/Spurh.exe
          Set-Content -Path portable-tmp/README.txt -Value "Spurh 便携版`r`n无需安装，双击 Spurh.exe 即可运行（需 Windows 10/11 自带 WebView2）。`r`n`r`nSHA: ${{ github.sha }}" -Encoding UTF8
          Compress-Archive -Path portable-tmp/* -DestinationPath "release-artifacts/spurh-windows-x64-portable.zip" -Force
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $nsis.FullName "release-artifacts/spurh-windows-x64.exe" -Force
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName "release-artifacts/spurh-windows-x64.msi" -Force
          Get-ChildItem release-artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: release-artifacts/*
          if-no-files-found: error

  build-macos:
    name: macOS 打包 (Intel + ARM 安装包)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 添加双平台编译目标
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 ARM (aarch64)
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: 构建 Intel (x86_64)
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: 归集产物并按规范命名
        shell: bash
        run: |
          mkdir -p release-artifacts
          arm=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          intel=$(ls src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          test -n "$arm" || { echo "ARM dmg 不存在"; exit 1; }
          test -n "$intel" || { echo "Intel dmg 不存在"; exit 1; }
          cp "$arm" release-artifacts/spurh-macos-arm.dmg
          cp "$intel" release-artifacts/spurh-macos-intel.dmg
          ls -la release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: 生成发布说明并发布 Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成发布说明 (自动读取 changelog)
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            FILE="changelog/$VER.md"
            test -f "$FILE" || { echo "缺少 changelog/$VER.md ，请创建后重试"; exit 1; }
          else
            VER=$(ls changelog/*.md 2>/dev/null | sed 's#changelog/##; s#\.md$##' | sort -V | tail -1)
            test -n "$VER" || { echo "changelog 目录为空"; exit 1; }
            FILE="changelog/$VER.md"
          fi
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"
          {
            echo "## Spurh v$VER"
            echo ""
            cat "$FILE"
            if [ "${{ github.ref_type }}" != "tag" ]; then
              echo ""
              echo "---"
              echo ""
              echo "### 本次构建提交"
              echo ""
              git log --oneline --no-merges -15 | sed 's/^/- /' || true
            fi
          } > notes.md
          cat notes.md

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            PRERELEASE=""
            TITLE="Spurh v${{ steps.notes.outputs.VERSION }}"
          else
            TAG="nightly-${GITHUB_SHA:0:8}"
            PRERELEASE="--prerelease"
            TITLE="Spurh v${{ steps.notes.outputs.VERSION }} 每日构建 ${GITHUB_SHA:0:8}"
          fi
          echo "TAG=$TAG TITLE=$TITLE REPO=$GITHUB_REPOSITORY"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".html_url" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/windows-bundle/* artifacts/macos-bundle/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --repo "$GITHUB_REPOSITORY" $PRERELEASE
          elif gh release create "$TAG" artifacts/windows-bundle/* artifacts/macos-bundle/* --title "$TITLE" --notes-file notes.md --repo "$GITHUB_REPOSITORY" $PRERELEASE; then
            echo "release created: $TAG"
          else
            echo "gh release create failed, fallback to gh api"
            if [ -n "$PRERELEASE" ]; then PR=true; else PR=false; fi
            jq -n --arg tag "$TAG" --arg title "$TITLE" --arg body "$(cat notes.md)" --arg pre "$PR" '{tag_name: $tag, name: $title, body: $body, prerelease: ($pre == "true")}' > release-body.json
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input release-body.json
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq ".html_url"

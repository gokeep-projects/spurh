name: Build & Release

# 每次推送到 main 自动打包 Windows + macOS 便携压缩包并发布；
# 推送 v* 标签时发布正式 Release（非 prerelease）。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spurh-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows 打包 (安装包 + 便携版)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用 (MSI + NSIS)
        run: npm run tauri build

      - name: 打包 Windows 便携压缩包
        shell: pwsh
        run: |
          $stamp = "${{ github.sha }}".Substring(0, 8)
          $stamp = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { $stamp }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item src-tauri/target/release/spurh.exe portable/Spurh.exe
          Set-Content -Path portable/README.txt -Value "Spurh 便携版`r`n无需安装，双击 Spurh.exe 即可运行（需 Windows 10/11 自带 WebView2）。`r`n`r`nSHA: ${{ github.sha }}`r`n时间: ${{ github.event.head_commit.timestamp }}" -Encoding UTF8
          Compress-Archive -Path portable/* -DestinationPath "Spurh-Windows-x64-$stamp-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            Spurh-Windows-*.zip
          if-no-files-found: error

  build-macos:
    name: macOS 打包 (dmg + .app 便携压缩包)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用 (dmg + app)
        run: npm run tauri build

      - name: 打包 macOS 便携压缩包
        shell: bash
        run: |
          stamp="${GITHUB_SHA:0:8}"
          if [ "${{ github.ref_type }}" = "tag" ]; then stamp="${{ github.ref_name }}"; stamp="${stamp#v}"; fi
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Spurh.app" "Spurh-macOS-$stamp-portable.app.zip"
          printf 'Spurh 便携版\n无需安装，解压后直接运行 Spurh.app。\nSHA: %s\n' "$GITHUB_SHA" > README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            Spurh-macOS-*.zip
          if-no-files-found: error

  release:
    name: 生成维护说明并发布 Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成维护说明
        id: notes
        shell: bash
        run: |
          {
            echo "## 维护说明"
            echo ""
            echo "本次自动构建包含以下维护内容："
            echo ""
            if [ "${{ github.ref_type }}" = "tag" ]; then
              git log --oneline --no-merges "${{ github.ref_name }}" -20 | sed 's/^/- /' || true
            else
              git log --oneline --no-merges -20 | sed 's/^/- /' || true
            fi
            echo ""
            echo "- 构建产物：Windows 安装包 (NSIS/MSI) + 便携压缩包；macOS dmg + .app 压缩包"
            echo "- 构建提交：${{ github.sha }}"
            echo "- 由 GitHub Actions 自动打包并发布"
          } > notes.md
          cat notes.md

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            PRERELEASE=""
            TITLE="Spurh ${{ github.ref_name }}"
          else
            TAG="nightly-${GITHUB_SHA:0:8}"
            PRERELEASE="--prerelease"
            TITLE="Spurh 每日构建 ${GITHUB_SHA:0:8}"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/windows-bundle/* artifacts/macos-bundle/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md $PRERELEASE
          else
            gh release create "$TAG" artifacts/windows-bundle/* artifacts/macos-bundle/* \
              --title "$TITLE" --notes-file notes.md $PRERELEASE
          fi
          gh release view "$TAG"

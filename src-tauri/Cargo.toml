[package]
name = "spurh"
version = "0.1.1"
description = "AI Native Developer Toolbox"
authors = ["xuning"]
edition = "2021"
license = "MIT"

[lib]
name = "spurh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：将前端 dist 内嵌进 exe（不启用则 release 版会回退加载 devUrl，无法独立运行）
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
arboard = "3"
tokio = { version = "1.53.1", features = ["full"] }
mysql = { version = "28.0.0", features = ["native-tls"] }
native-tls = "0.2"
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
postgres-native-tls = "0.5"
hickory-resolver = "0.26.1"
keyring = { version = "3", features = ["windows-native"] }
russh = "0.62.5"
base64 = "0.23.0"
rusqlite = { version = "0.37", features = ["bundled"] }
encoding_rs = "0.8"
if-addrs = "0.15"
gethostname = "1"
default-net = "0.22"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(windows))'.dependencies]
socket2 = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
codegen-units = 1
panic = "abort"

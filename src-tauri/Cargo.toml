[package]
name = "spurh"
version = "0.1.0"
description = "AI Native Developer Toolbox"
authors = ["xuning"]
edition = "2021"
license = "MIT"

[lib]
name = "spurh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
arboard = "3"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
codegen-units = 1
panic = "abort"
